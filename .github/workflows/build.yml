name: Linux build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cross_tool: [ "m68k-atari-mint", "m68k-atari-mintelf" ]
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH keys
        if: ${{ github.event_name == 'push' }}
        env:
          SSH_ID: ${{ secrets.SSH_ID_JOSKA }}
        run: ./.scripts/install_ssh_id.sh
      - name: Setup environment
        env:
          PROJECT_VERSION: "0.44.0"
          CROSS_TOOL: ${{ matrix.cross_tool }}
        run: ./.scripts/setup_env.sh
      - name: Install packages
        run: |
          SYSROOT_DIR="/" ./.scripts/install-freemint.sh binutils gcc mintbin
          ./.scripts/install-freemint.sh mintlib
      - name: build
        run: ./.scripts/build.sh
      - name: deploy
        if: ${{ github.event_name == 'push' }}
        env:
          COMMITER_NAME: ${{ github.event.commits[0].author.name }}
          COMMITER_EMAIL: ${{ github.event.commits[0].author.email }}
        run: ./.scripts/deploy.sh

  ptos-bindings:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kelihlodversson/pTOS
          ref: ef79767c0a452bb98d5085875d4780b300117462
          path: ptos-sdk
      - name: Build native x32 bindings
        run: |
          make BACKEND=ptos ARCH=x32 PTOS_INCLUDE="$PWD/ptos-sdk/include"
          nm -g --defined-only .libptos-x32/libgem.a > bindings.symbols
          grep ' aes_global$' bindings.symbols
          grep ' appl_init$' bindings.symbols
          if grep ' mt_' bindings.symbols; then exit 1; fi
      - name: Exercise binding ownership and forwarding
        run: |
          make BACKEND=ptos ARCH=x32 CC=cc PTOS_FLAGS_x32= PTOS_BUILD=.libptos-host PTOS_INCLUDE="$PWD/ptos-sdk/include"
          cc -std=gnu90 -Wall -Wextra -Werror -Iptos -Iptos-sdk/include -Wl,--gc-sections tests/ptos-bindings.c .libptos-host/libgem.a -o ptos-bindings-test
          ./ptos-bindings-test
          c++ -std=c++11 -Wall -Wextra -Werror -Iptos -Iptos-sdk/include tests/ptos-headers.cpp .libptos-host/libgem.a -o ptos-headers-test
          ./ptos-headers-test
